[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "forensix"
version = "8.0.0"
description = "Automated Digital Forensics and Incident Triage Platform"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"forensix" = ["ui/*"]
