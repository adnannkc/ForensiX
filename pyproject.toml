[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "forensix"
version = "9.1.0"
description = "Python-based digital forensics and incident-triage tool for Linux evidence, with a controlled multi-stage pipeline."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Logging",
]

[project.urls]
Repository = "https://github.com/adnannkc/ForensiX"
Issues = "https://github.com/adnannkc/ForensiX/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"forensix" = ["ui/*"]

[project.scripts]
forensix = "forensix.main:main"

